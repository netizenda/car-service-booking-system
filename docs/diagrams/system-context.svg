<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}
.title{font-size:22px;font-weight:700}
.subtitle{font-size:14px;fill:#444}
.label{font-size:14px}
.small{font-size:12px}
.actor{font-size:15px;font-weight:700}
.box{fill:#fff;stroke:#333;stroke-width:2}
.soft{fill:#f7f8fa;stroke:#555;stroke-width:1.8}
.line{stroke:#333;stroke-width:1.8;fill:none}
.dash{stroke:#666;stroke-width:1.5;fill:none;stroke-dasharray:7 6}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text x="700" y="45" text-anchor="middle" class="title"><tspan x="700" dy="0">System Context Diagram</tspan></text><text x="700" y="72" text-anchor="middle" class="subtitle"><tspan x="700" dy="0">Car Service Booking and Management System</tspan></text><rect x="455" y="300" rx="28" ry="28" width="490" height="240" class="soft"/><text x="700" y="375" text-anchor="middle" class="title"><tspan x="700" dy="0">Car Service Booking and</tspan><tspan x="700" dy="20">Management System</tspan></text><text x="700" y="455" text-anchor="middle" class="subtitle"><tspan x="700" dy="0">Web-based system for booking,</tspan><tspan x="700" dy="20">managing and tracking car services</tspan></text><circle cx="185" cy="350" r="16" class="box"/><line x1="185" y1="366" x2="185" y2="420" class="line"/><line x1="155" y1="388" x2="215" y2="388" class="line"/><line x1="185" y1="420" x2="157" y2="465" class="line"/><line x1="185" y1="420" x2="213" y2="465" class="line"/><text x="185" y="495" text-anchor="middle" class="actor"><tspan x="185" dy="0">Customer</tspan></text><circle cx="1215" cy="350" r="16" class="box"/><line x1="1215" y1="366" x2="1215" y2="420" class="line"/><line x1="1185" y1="388" x2="1245" y2="388" class="line"/><line x1="1215" y1="420" x2="1187" y2="465" class="line"/><line x1="1215" y1="420" x2="1243" y2="465" class="line"/><text x="1215" y="495" text-anchor="middle" class="actor"><tspan x="1215" dy="0">Mechanic</tspan></text><circle cx="700" cy="105" r="16" class="box"/><line x1="700" y1="121" x2="700" y2="175" class="line"/><line x1="670" y1="143" x2="730" y2="143" class="line"/><line x1="700" y1="175" x2="672" y2="220" class="line"/><line x1="700" y1="175" x2="728" y2="220" class="line"/><text x="700" y="250" text-anchor="middle" class="actor"><tspan x="700" dy="0">Admin</tspan></text><rect x="60" y="590" width="320" height="205" rx="12" class="box"/><text x="220" y="625" text-anchor="middle" class="actor"><tspan x="220" dy="0">Customer interactions</tspan></text><text x="95" y="660" text-anchor="start" class="label"><tspan x="95" dy="0">• Registration and login</tspan><tspan x="95" dy="24">• Vehicle management</tspan><tspan x="95" dy="24">• View services and available slots</tspan><tspan x="95" dy="24">• Create / manage bookings</tspan><tspan x="95" dy="24">• Track booking status</tspan><tspan x="95" dy="24">• View service history</tspan></text><rect x="1020" y="590" width="320" height="180" rx="12" class="box"/><text x="1180" y="625" text-anchor="middle" class="actor"><tspan x="1180" dy="0">Mechanic interactions</tspan></text><text x="1055" y="660" text-anchor="start" class="label"><tspan x="1055" dy="0">• View assigned jobs</tspan><tspan x="1055" dy="24">• View daily schedule</tspan><tspan x="1055" dy="24">• Update service status</tspan><tspan x="1055" dy="24">• Add service comments</tspan><tspan x="1055" dy="24">• Complete service</tspan></text><rect x="980" y="65" width="330" height="190" rx="12" class="box"/><text x="1145" y="100" text-anchor="middle" class="actor"><tspan x="1145" dy="0">Admin interactions</tspan></text><text x="1015" y="135" text-anchor="start" class="label"><tspan x="1015" dy="0">• Manage services and bookings</tspan><tspan x="1015" dy="24">• Assign mechanics</tspan><tspan x="1015" dy="24">• Manage users and mechanics</tspan><tspan x="1015" dy="24">• View workshop schedule</tspan><tspan x="1015" dy="24">• View basic statistics</tspan></text><line x1="315" y1="410" x2="455" y2="410" class="line" marker-end="url(#arrow)"/><line x1="1085" y1="410" x2="945" y2="410" class="line" marker-end="url(#arrow)"/><line x1="700" y1="255" x2="700" y2="300" class="line" marker-end="url(#arrow)"/></svg>