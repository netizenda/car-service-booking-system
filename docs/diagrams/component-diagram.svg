<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text x="750" y="45" text-anchor="middle" class="title"><tspan x="750" dy="0">Component Diagram</tspan></text><text x="750" y="72" text-anchor="middle" class="subtitle"><tspan x="750" dy="0">Car Service Booking and Management System</tspan></text><rect x="65" y="335" width="230" height="125" rx="16" class="soft"/><text x="180.0" y="373" text-anchor="middle" class="actor"><tspan x="180.0" dy="0">Web Browser</tspan></text><text x="180.0" y="407" text-anchor="middle" class="label"><tspan x="180.0" dy="0">Customer</tspan><tspan x="180.0" dy="22">Mechanic</tspan><tspan x="180.0" dy="22">Admin</tspan></text><rect x="380" y="315" width="250" height="165" rx="16" class="soft"/><text x="505.0" y="353" text-anchor="middle" class="actor"><tspan x="505.0" dy="0">Frontend</tspan></text><text x="505.0" y="387" text-anchor="middle" class="label"><tspan x="505.0" dy="0">React + TypeScript</tspan><tspan x="505.0" dy="22">Tailwind CSS</tspan></text><rect x="735" y="315" width="250" height="165" rx="16" class="soft"/><text x="860.0" y="353" text-anchor="middle" class="actor"><tspan x="860.0" dy="0">Backend API</tspan></text><text x="860.0" y="387" text-anchor="middle" class="label"><tspan x="860.0" dy="0">Go + Gin</tspan><tspan x="860.0" dy="22">REST controllers</tspan><tspan x="860.0" dy="22">Business logic</tspan></text><rect x="1110" y="315" width="250" height="165" rx="16" class="soft"/><text x="1235.0" y="353" text-anchor="middle" class="actor"><tspan x="1235.0" dy="0">Database</tspan></text><text x="1235.0" y="387" text-anchor="middle" class="label"><tspan x="1235.0" dy="0">PostgreSQL</tspan></text><rect x="735" y="105" width="250" height="125" rx="16" class="soft"/><text x="860.0" y="143" text-anchor="middle" class="actor"><tspan x="860.0" dy="0">Auth / Authorization</tspan></text><text x="860.0" y="177" text-anchor="middle" class="label"><tspan x="860.0" dy="0">JWT</tspan><tspan x="860.0" dy="22">Role-based checks</tspan></text><rect x="735" y="590" width="250" height="125" rx="16" class="soft"/><text x="860.0" y="628" text-anchor="middle" class="actor"><tspan x="860.0" dy="0">Data Access</tspan></text><text x="860.0" y="662" text-anchor="middle" class="label"><tspan x="860.0" dy="0">GORM</tspan></text><rect x="380" y="590" width="250" height="125" rx="16" class="soft"/><text x="505.0" y="628" text-anchor="middle" class="actor"><tspan x="505.0" dy="0">Deployment</tspan></text><text x="505.0" y="662" text-anchor="middle" class="label"><tspan x="505.0" dy="0">Docker</tspan><tspan x="505.0" dy="22">Docker Compose</tspan></text><line x1="295" y1="397" x2="380" y2="397" class="line" marker-end="url(#arrow)"/><text x="338" y="382" text-anchor="middle" class="small"><tspan x="338" dy="0">HTTPS / UI</tspan></text><line x1="630" y1="397" x2="735" y2="397" class="line" marker-end="url(#arrow)"/><text x="682" y="382" text-anchor="middle" class="small"><tspan x="682" dy="0">REST / JSON</tspan></text><line x1="985" y1="397" x2="1110" y2="397" class="line" marker-end="url(#arrow)"/><text x="1048" y="382" text-anchor="middle" class="small"><tspan x="1048" dy="0">SQL via GORM</tspan></text><line x1="860" y1="315" x2="860" y2="230" class="line" marker-end="url(#arrow)"/><text x="930" y="270" text-anchor="middle" class="small"><tspan x="930" dy="0">JWT validation</tspan></text><line x1="860" y1="480" x2="860" y2="590" class="line" marker-end="url(#arrow)"/><text x="935" y="545" text-anchor="middle" class="small"><tspan x="935" dy="0">Models / queries</tspan></text><path d="M 505 590 L 505 545 L 505 545 L 505 480" class="dash"/><path d="M 505 590 L 505 545 L 860 545 L 860 480" class="dash"/><path d="M 505 590 L 505 545 L 1235 545 L 1235 480" class="dash"/><text x="505" y="745" text-anchor="middle" class="subtitle"><tspan x="505" dy="0">Containerized runtime</tspan></text></svg>